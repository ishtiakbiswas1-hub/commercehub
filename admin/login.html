<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - E-Commerce Affiliate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4 text-slate-100">

    <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-2xl p-8 border border-slate-700">
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg shadow-indigo-500/30">
                <i class="fa-solid fa-user-shield text-2xl text-white"></i>
            </div>
            <h1 class="text-2xl font-bold text-white">অ্যাডমিন প্যানেল লগইন</h1>
            <p class="text-slate-400 text-sm mt-1">শুধুমাত্র অনুমোদিত অ্যাডমিন প্রবেশ করতে পারবেন</p>
        </div>

        <!-- Alert Notification -->
        <div id="errorAlert" class="hidden mb-6 p-4 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-sm flex items-center gap-3">
            <i class="fa-solid fa-circle-exclamation text-lg"></i>
            <span id="errorMessage">লগইন তথ্য সঠিক নয়!</span>
        </div>

        <!-- Login Form -->
        <form id="adminLoginForm" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">ইমেইল ঠিকানা</label>
                <div class="relative">
                    <i class="fa-solid fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                    <input type="email" id="email" required placeholder="admin@example.com" 
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl py-3 pl-11 pr-4 text-slate-200 placeholder-slate-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-sm">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">পাসওয়ার্ড</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                    <input type="password" id="password" required placeholder="••••••••" 
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl py-3 pl-11 pr-4 text-slate-200 placeholder-slate-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-sm">
                </div>
            </div>

            <button type="submit" id="loginBtn" 
                class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 font-semibold text-white rounded-xl shadow-lg shadow-indigo-600/20 transition-all flex items-center justify-center gap-2">
                <span id="btnText">লগইন করুন</span>
                <i id="btnSpinner" class="fa-solid fa-circle-notch animate-spin hidden"></i>
            </button>
        </form>
    </div>

    <!-- Firebase Auth Logic Script -->
    <script type="module">
        import { loginAdmin, checkAuthState } from '../assets/js/firebase.js';

        // Check if user is already logged in
        checkAuthState((user) => {
            if (user) {
                window.location.href = 'dashboard.html';
            }
        });

        const form = document.getElementById('adminLoginForm');
        const errorAlert = document.getElementById('errorAlert');
        const errorMessage = document.getElementById('errorMessage');
        const loginBtn = document.getElementById('loginBtn');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // UI Loading State
            loginBtn.disabled = true;
            btnText.textContent = "যাচাই করা হচ্ছে...";
            btnSpinner.classList.remove('hidden');
            errorAlert.classList.add('hidden');

            try {
                await loginAdmin(email, password);
                window.location.href = 'dashboard.html';
            } catch (error) {
                errorAlert.classList.remove('hidden');
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                    errorMessage.textContent = 'ইমেইল অথবা পাসওয়ার্ড ভুল হয়েছে!';
                } else if (error.code === 'auth/too-many-requests') {
                    errorMessage.textContent = 'অনেকবার ভুল চেষ্টা করা হয়েছে। কিছুক্ষণ পর চেষ্টা করুন।';
                } else {
                    errorMessage.textContent = 'লগইন করতে সমস্যা হচ্ছে: ' + error.message;
                }
            } finally {
                loginBtn.disabled = false;
                btnText.textContent = "লগইন করুন";
                btnSpinner.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
