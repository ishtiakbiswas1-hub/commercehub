<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাডভারটাইজমেন্ট ম্যানেজমেন্ট - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Screen Loader -->
    <div id="loadingOverlay" class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center">
        <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-indigo-500"></div>
    </div>

    <div class="flex min-h-screen">
        <!-- Sidebar Navigation -->
        <aside class="w-64 bg-slate-800 border-r border-slate-700 flex flex-col shrink-0">
            <div class="p-5 border-b border-slate-700 flex items-center gap-3">
                <div class="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-600/30">
                    <i class="fa-solid fa-cart-shopping"></i>
                </div>
                <div>
                    <h2 class="font-bold text-white text-base">Affiliate Admin</h2>
                    <span class="text-[11px] text-indigo-400 font-medium">E-COMMERCE PANEL</span>
                </div>
            </div>

            <nav class="p-4 space-y-1.5 flex-1">
                <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-700/50 hover:text-slate-200 rounded-xl font-medium text-sm transition-all">
                    <i class="fa-solid fa-chart-pie"></i>
                    <span>ড্যাশবোর্ড</span>
                </a>
                <a href="products.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-700/50 hover:text-slate-200 rounded-xl font-medium text-sm transition-all">
                    <i class="fa-solid fa-box"></i>
                    <span>প্রোডাক্ট ম্যানেজমেন্ট</span>
                </a>
                <a href="advertisements.html" class="flex items-center gap-3 px-4 py-3 bg-indigo-600/10 text-indigo-400 rounded-xl font-medium text-sm transition-all border border-indigo-500/20">
                    <i class="fa-solid fa-rectangle-ad"></i>
                    <span>বিজ্ঞাপন ম্যানেজমেন্ট</span>
                </a>
            </nav>

            <div class="p-4 border-t border-slate-700">
                <button id="logoutBtn" class="w-full py-2.5 bg-red-500/10 hover:bg-red-500/20 text-red-400 text-xs font-semibold rounded-xl border border-red-500/20 flex items-center justify-center gap-2 transition-all">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>লগআউট করুন</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-6 md:p-8 overflow-x-hidden">
            <header class="mb-8 pb-4 border-b border-slate-800">
                <h1 class="text-2xl font-bold text-white">Adsterra অ্যাডভারটাইজমেন্ট স্লট</h1>
                <p class="text-xs text-slate-400 mt-1">আপনার ৪টি নির্ধারিত বিজ্ঞাপন স্লট স্বাধীনভাবে কনফিগার ও আপডেট করুন</p>
            </header>

            <!-- 4 Ad Slots Grid -->
            <div id="adSlotsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Dynamic Ad Slots will load here -->
            </div>
        </main>
    </div>

    <!-- Edit Ad Modal -->
    <div id="adModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-lg p-6 shadow-2xl">
            <div class="flex justify-between items-center pb-4 mb-4 border-b border-slate-700">
                <h3 id="modalTitle" class="text-lg font-bold text-white">অ্যাড স্লট এডিট করুন</h3>
                <button id="closeModalBtn" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>

            <form id="adForm" class="space-y-4">
                <input type="hidden" id="adSlotId">

                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">বিজ্ঞাপনের নাম (Ad Name)</label>
                    <input type="text" id="adName" required class="w-full bg-slate-900 border border-slate-700 rounded-xl py-2.5 px-3 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Adsterra অ্যাড কোড / স্ক্রিপ্ট (Script)</label>
                    <textarea id="adScript" rows="5" placeholder="<script type='text/javascript'>...</script>" required class="w-full bg-slate-900 border border-slate-700 rounded-xl py-2.5 px-3 font-mono text-xs text-slate-100 focus:outline-none focus:border-indigo-500"></textarea>
                    <p class="text-[11px] text-amber-400 mt-1">⚠️ অ্যাডমিন প্যানেলে এই কোডটি এক্সিকিউট হবে না, শুধু সুরক্ষিতভাবে সেভ থাকবে।</p>
                </div>

                <div class="flex items-center gap-2 pt-2">
                    <input type="checkbox" id="adStatus" class="w-4 h-4 rounded accent-indigo-600">
                    <label for="adStatus" class="text-xs text-slate-300 cursor-pointer font-semibold">এই অ্যাড স্লটটি চালু (Active) রাখুন</label>
                </div>

                <div class="flex justify-end gap-3 pt-4 border-t border-slate-700">
                    <button type="button" id="cancelModalBtn" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-semibold rounded-xl">বাতিল</button>
                    <button type="submit" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-xl">সংরক্ষণ করুন</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Block -->
    <script type="module">
        import { checkAuthState, logoutAdmin, db } from '../assets/js/firebase.js';
        import { doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const loadingOverlay = document.getElementById('loadingOverlay');
        const container = document.getElementById('adSlotsContainer');
        const modal = document.getElementById('adModal');
        const adForm = document.getElementById('adForm');

        checkAuthState((user) => {
            if (!user) window.location.href = 'login.html';
            else {
                loadingOverlay.classList.add('hidden');
                loadAdSlots();
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            if (confirm('লগআউট করতে চান?')) {
                await logoutAdmin();
                window.location.href = 'login.html';
            }
        });

        // 4 Fixed Ad Slots Initializer & Loader
        async function loadAdSlots() {
            container.innerHTML = '';
            const slotIds = ['slot_1', 'slot_2', 'slot_3', 'slot_4'];
            const defaultNames = ['Header Advertisement (728x90)', 'Homepage Top Banner (300x250)', 'Between Product Listings', 'Footer Advertisement (728x90)'];

            for (let i = 0; i < slotIds.length; i++) {
                const sId = slotIds[i];
                const docRef = doc(db, "advertisements", sId);
                let docSnap = await getDoc(docRef);

                let adData = {
                    name: defaultNames[i],
                    script: '',
                    status: false
                };

                if (!docSnap.exists()) {
                    // Create default doc if not exists in Firestore
                    await setDoc(docRef, adData);
                } else {
                    adData = docSnap.data();
                }

                const card = document.createElement('div');
                card.className = 'bg-slate-800 border border-slate-700 rounded-2xl p-5 flex flex-col justify-between shadow-xl';
                card.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-3">
                            <span class="px-2.5 py-1 bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 text-[11px] font-bold rounded-lg uppercase tracking-wider">অ্যাড স্লট ${i + 1}</span>
                            <span class="px-2.5 py-1 text-[10px] font-semibold rounded-full ${adData.status ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-slate-700 text-slate-400'}">
                                ${adData.status ? 'Active' : 'Disabled'}
                            </span>
                        </div>
                        <h3 class="text-base font-bold text-white mb-2">${adData.name}</h3>
                        <div class="bg-slate-900 border border-slate-700/60 rounded-xl p-3 mb-4">
                            <p class="text-[11px] text-slate-400 uppercase font-semibold mb-1">কনফিগারড কোড স্নিপেট:</p>
                            <code class="text-xs text-indigo-300 font-mono line-clamp-2">${adData.script ? escapeHtml(adData.script) : '// কোনো বিজ্ঞাপন কোড দেওয়া হয়নি'}</code>
                        </div>
                    </div>
                    <button onclick="openEditAdModal('${sId}', '${escapeAttr(adData.name)}', '${escapeAttr(adData.script)}', ${adData.status})" class="w-full py-2.5 bg-slate-700 hover:bg-slate-600 text-white font-semibold text-xs rounded-xl flex items-center justify-center gap-2 transition-all">
                        <i class="fa-solid fa-pen-to-square"></i>
                        <span>অ্যাড কোড এডিট করুন</span>
                    </button>
                `;
                container.appendChild(card);
            }
        }

        // Modal Controls
        window.openEditAdModal = (id, name, script, status) => {
            document.getElementById('adSlotId').value = id;
            document.getElementById('adName').value = name;
            document.getElementById('adScript').value = script;
            document.getElementById('adStatus').checked = status;
            document.getElementById('modalTitle').textContent = `এডিট: ${name}`;
            modal.classList.remove('hidden');
        };

        const closeModal = () => modal.classList.add('hidden');
        document.getElementById('closeModalBtn').addEventListener('click', closeModal);
        document.getElementById('cancelModalBtn').addEventListener('click', closeModal);

        // Save Ad Configuration
        adForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('adSlotId').value;
            const name = document.getElementById('adName').value;
            const script = document.getElementById('adScript').value;
            const status = document.getElementById('adStatus').checked;

            try {
                const docRef = doc(db, "advertisements", id);
                await updateDoc(docRef, { name, script, status });
                closeModal();
                loadAdSlots();
            } catch (err) {
                alert('বিজ্ঞাপন আপডেট করতে সমস্যা হয়েছে: ' + err.message);
            }
        });

        // Security Helper Functions
        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
        function escapeAttr(text) {
            return text.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
