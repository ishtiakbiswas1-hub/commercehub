<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রোডাক্ট ম্যানেজমেন্ট - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Screen Loader -->
    <div id="loadingOverlay" class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center">
        <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-indigo-500"></div>
    </div>

    <!-- Mobile Header -->
    <div class="md:hidden bg-slate-800 border-b border-slate-700 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center font-bold text-white text-xs">
                <i class="fa-solid fa-cart-shopping"></i>
            </div>
            <span class="font-bold text-sm text-white">Affiliate Admin</span>
        </div>
        <div class="flex items-center gap-2">
            <a href="dashboard.html" class="p-2 text-slate-300 hover:text-white bg-slate-700/50 rounded-lg text-xs"><i class="fa-solid fa-chart-pie"></i></a>
            <a href="advertisements.html" class="p-2 text-slate-300 hover:text-white bg-slate-700/50 rounded-lg text-xs"><i class="fa-solid fa-rectangle-ad"></i></a>
        </div>
    </div>

    <div class="flex flex-col md:flex-row min-h-screen flex-1">
        <!-- Sidebar Navigation (Hidden on small mobile, accessible via bottom or top bar) -->
        <aside class="hidden md:flex w-64 bg-slate-800 border-r border-slate-700 flex-col shrink-0">
            <div class="p-5 border-b border-slate-700 flex items-center gap-3">
                <div class="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-600/30">
                    <i class="fa-solid fa-cart-shopping"></i>
                </div>
                <div>
                    <h2 class="font-bold text-white text-base">Affiliate Admin</h2>
                    <span class="text-[11px] text-indigo-400 font-medium">E-COMMERCE PANEL</span>
                </div>
            </div>

            <nav class="p-4 space-y-1.5 flex-1">
                <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-700/50 hover:text-slate-200 rounded-xl font-medium text-sm transition-all">
                    <i class="fa-solid fa-chart-pie"></i>
                    <span>ড্যাশবোর্ড</span>
                </a>
                <a href="products.html" class="flex items-center gap-3 px-4 py-3 bg-indigo-600/10 text-indigo-400 rounded-xl font-medium text-sm transition-all border border-indigo-500/20">
                    <i class="fa-solid fa-box"></i>
                    <span>প্রোডাক্ট ম্যানেজমেন্ট</span>
                </a>
                <a href="advertisements.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-700/50 hover:text-slate-200 rounded-xl font-medium text-sm transition-all">
                    <i class="fa-solid fa-rectangle-ad"></i>
                    <span>বিজ্ঞাপন ম্যানেজমেন্ট</span>
                </a>
            </nav>

            <div class="p-4 border-t border-slate-700">
                <button id="logoutBtn" class="w-full py-2.5 bg-red-500/10 hover:bg-red-500/20 text-red-400 text-xs font-semibold rounded-xl border border-red-500/20 flex items-center justify-center gap-2 transition-all">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>লগআউট করুন</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-4 md:p-8 overflow-x-hidden pb-20 md:pb-8">
            <header class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6 pb-4 border-b border-slate-800">
                <div>
                    <h1 class="text-xl md:text-2xl font-bold text-white">প্রোডাক্ট লিস্ট</h1>
                    <p class="text-xs text-slate-400 mt-0.5">সবগুলো প্রোডাক্ট এক পলকে দেখুন ও ম্যানেজ করুন</p>
                </div>
                <button id="openAddModalBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs md:text-sm py-2.5 px-4 rounded-xl shadow-lg shadow-indigo-600/20 flex items-center justify-center gap-2 transition-all">
                    <i class="fa-solid fa-plus"></i>
                    <span>নতুন প্রোডাক্ট যোগ করুন</span>
                </button>
            </header>

            <!-- Responsive Table Card -->
            <div class="bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden shadow-xl">
                <div class="overflow-x-auto w-full">
                    <table class="w-full text-left border-collapse text-xs md:text-sm min-w-[600px]">
                        <thead>
                            <tr class="bg-slate-900/60 text-slate-400 text-[11px] uppercase tracking-wider border-b border-slate-700">
                                <th class="p-3 md:p-4">ছবি</th>
                                <th class="p-3 md:p-4">টাইটেল</th>
                                <th class="p-3 md:p-4">ক্যাটাগরি</th>
                                <th class="p-3 md:p-4">মূল্য (BDT)</th>
                                <th class="p-3 md:p-4">স্ট্যাটাস</th>
                                <th class="p-3 md:p-4 text-center">অ্যাকশন</th>
                            </tr>
                        </thead>
                        <tbody id="productsTableBody" class="divide-y divide-slate-700/50">
                            <!-- Dynamic Content -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Mobile Bottom Navigation Bar -->
    <div class="md:hidden fixed bottom-0 left-0 right-0 bg-slate-800 border-t border-slate-700 px-4 py-2 flex items-center justify-around z-40 text-xs">
        <a href="dashboard.html" class="flex flex-col items-center text-slate-400 py-1">
            <i class="fa-solid fa-chart-pie text-base mb-0.5"></i>
            <span>ড্যাশবোর্ড</span>
        </a>
        <a href="products.html" class="flex flex-col items-center text-indigo-400 font-semibold py-1">
            <i class="fa-solid fa-box text-base mb-0.5"></i>
            <span>প্রোডাক্ট</span>
        </a>
        <a href="advertisements.html" class="flex flex-col items-center text-slate-400 py-1">
            <i class="fa-solid fa-rectangle-ad text-base mb-0.5"></i>
            <span>বিজ্ঞাপন</span>
        </a>
    </div>

    <!-- Product Modal (Add/Edit) -->
    <div id="productModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3 sm:p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-lg p-5 md:p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center pb-3 mb-4 border-b border-slate-700">
                <h3 id="modalTitle" class="text-base md:text-lg font-bold text-white">নতুন প্রোডাক্ট যোগ করুন</h3>
                <button id="closeModalBtn" class="text-slate-400 hover:text-white p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <form id="productForm" class="space-y-3.5">
                <input type="hidden" id="productId">

                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 uppercase mb-1">প্রোডাক্ট টাইটেল *</label>
                    <input type="text" id="title" required class="w-full bg-slate-900 border border-slate-700 rounded-xl py-2.5 px-3 text-xs md:text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 uppercase mb-1">ক্যাটাগরি *</label>
                        <select id="category" required class="w-full bg-slate-900 border border-slate-700 rounded-xl py-2.5 px-3 text-xs md:text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                            <option value="Electronics">Electronics</option>
                            <option value="Fashion">Fashion</option>
                            <option value="Gadgets">Gadgets</option>
                            <option value="Home & Lifestyle">Home & Lifestyle</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 uppercase mb-1">মূল্য (৳ BDT)</label>
                        <input type="number" id="price" placeholder="যেমন: 1250" class="w-full bg-slate-900 border border-slate-700 rounded-xl py-2.5 px-3 text-xs md:text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 uppercase mb-1">বাই নাউ (Buy Now) লিংক (HTTPS) *</label>
                    <input type="url" id="buyNowUrl" placeholder="https://daraz.com.bd/product..." required class="w-full bg-slate-900 border border-slate-700 rounded-xl py-2.5 px-3 text-xs md:text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 uppercase mb-1">ইমেজ মোড</label>
                    <div class="flex gap-4 mb-2">
                        <label class="text-xs text-slate-300 flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="imageMode" value="url" checked class="accent-indigo-500"> URL লিংক
                        </label>
                        <label class="text-xs text-slate-300 flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="imageMode" value="upload" class="accent-indigo-500"> ফাইল আপলোড
                        </label>
                    </div>

                    <div id="urlInputContainer">
                        <input type="url" id="imageUrl" placeholder="https://example.com/image.jpg" class="w-full bg-slate-900 border border-slate-700 rounded-xl py-2.5 px-3 text-xs md:text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div id="fileInputContainer" class="hidden">
                        <input type="file" id="imageFile" accept="image/*" class="w-full bg-slate-900 border border-slate-700 rounded-xl py-2 px-3 text-xs text-slate-400">
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 uppercase mb-1">বিবরণ</label>
                    <textarea id="description" rows="2" class="w-full bg-slate-900 border border-slate-700 rounded-xl py-2 px-3 text-xs md:text-sm text-slate-100 focus:outline-none focus:border-indigo-500"></textarea>
                </div>

                <div class="flex items-center gap-6 pt-1">
                    <label class="flex items-center gap-2 text-xs text-slate-300 cursor-pointer">
                        <input type="checkbox" id="status" checked class="w-4 h-4 rounded accent-indigo-600">
                        <span>পাবলিশড (Active)</span>
                    </label>
                    <label class="flex items-center gap-2 text-xs text-slate-300 cursor-pointer">
                        <input type="checkbox" id="featured" class="w-4 h-4 rounded accent-indigo-600">
                        <span>ফিচার্ড প্রোডাক্ট</span>
                    </label>
                </div>

                <div class="flex justify-end gap-3 pt-3 border-t border-slate-700">
                    <button type="button" id="cancelModalBtn" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-semibold rounded-xl">বাতিল</button>
                    <button type="submit" id="saveProductBtn" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-xl">সেভ করুন</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Block -->
    <script type="module">
        import { 
            checkAuthState, 
            logoutAdmin, 
            addProductToDB, 
            updateProductInDB, 
            deleteProductFromDB, 
            listenToProducts, 
            uploadProductImage 
        } from '../assets/js/firebase.js';

        const loadingOverlay = document.getElementById('loadingOverlay');
        const modal = document.getElementById('productModal');
        const productForm = document.getElementById('productForm');
        const tableBody = document.getElementById('productsTableBody');

        checkAuthState((user) => {
            if (!user) window.location.href = 'login.html';
            else loadingOverlay.classList.add('hidden');
        });

        document.getElementById('logoutBtn')?.addEventListener('click', async () => {
            if (confirm('লগআউট করতে চান?')) {
                await logoutAdmin();
                window.location.href = 'login.html';
            }
        });

        document.querySelectorAll('input[name="imageMode"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                if (e.target.value === 'url') {
                    document.getElementById('urlInputContainer').classList.remove('hidden');
                    document.getElementById('fileInputContainer').classList.add('hidden');
                } else {
                    document.getElementById('urlInputContainer').classList.add('hidden');
                    document.getElementById('fileInputContainer').classList.remove('hidden');
                }
            });
        });

        document.getElementById('openAddModalBtn').addEventListener('click', () => {
            productForm.reset();
            document.getElementById('productId').value = '';
            document.getElementById('modalTitle').textContent = 'নতুন প্রোডাক্ট যোগ করুন';
            modal.classList.remove('hidden');
        });

        const closeModal = () => modal.classList.add('hidden');
        document.getElementById('closeModalBtn').addEventListener('click', closeModal);
        document.getElementById('cancelModalBtn').addEventListener('click', closeModal);

        listenToProducts((products) => {
            tableBody.innerHTML = '';
            if (products.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-slate-500 text-xs">কোনো প্রোডাক্ট পাওয়া যায়নি।</td></tr>`;
                return;
            }

            products.forEach(p => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-800/50 transition-all';
                tr.innerHTML = `
                    <td class="p-3 md:p-4">
                        <img src="${p.imageUrl || 'https://via.placeholder.com/50'}" class="w-10 h-10 md:w-12 md:h-12 object-cover rounded-lg border border-slate-700">
                    </td>
                    <td class="p-3 md:p-4 font-semibold text-slate-200 max-w-[150px] truncate">${p.title}</td>
                    <td class="p-3 md:p-4 text-slate-400 text-xs">${p.category}</td>
                    <td class="p-3 md:p-4 font-semibold text-emerald-400">৳ ${p.price || 0}</td>
                    <td class="p-3 md:p-4">
                        <span class="px-2 py-0.5 text-[10px] font-semibold rounded-full ${p.status ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-red-500/10 text-red-400 border border-red-500/20'}">
                            ${p.status ? 'Active' : 'Inactive'}
                        </span>
                    </td>
                    <td class="p-3 md:p-4 text-center space-x-1">
                        <button onclick="editProduct('${p.id}')" class="p-1.5 md:p-2 text-indigo-400 hover:text-indigo-300 bg-indigo-500/10 rounded-lg"><i class="fa-solid fa-pen-to-square"></i></button>
                        <button onclick="deleteProduct('${p.id}')" class="p-1.5 md:p-2 text-red-400 hover:text-red-300 bg-red-500/10 rounded-lg"><i class="fa-solid fa-trash"></i></button>
                    </td>
                `;
                tableBody.appendChild(tr);
            });
            window.allProducts = products;
        });

        productForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('productId').value;
            const title = document.getElementById('title').value;
            const category = document.getElementById('category').value;
            const price = Number(document.getElementById('price').value || 0);
            const buyNowUrl = document.getElementById('buyNowUrl').value;
            const description = document.getElementById('description').value;
            const status = document.getElementById('status').checked;
            const featured = document.getElementById('featured').checked;
            const imageMode = document.querySelector('input[name="imageMode"]:checked').value;

            let imageUrl = document.getElementById('imageUrl').value;

            try {
                if (imageMode === 'upload') {
                    const fileInput = document.getElementById('imageFile');
                    if (fileInput.files.length > 0) {
                        imageUrl = await uploadProductImage(fileInput.files[0]);
                    }
                }

                const productData = { title, category, price, buyNowUrl, description, imageUrl, status, featured };

                if (id) {
                    await updateProductInDB(id, productData);
                } else {
                    await addProductToDB(productData);
                }
                closeModal();
            } catch (err) {
                alert('ত্রুটি হয়েছে: ' + err.message);
            }
        });

        window.editProduct = (id) => {
            const p = window.allProducts.find(item => item.id === id);
            if (!p) return;
            document.getElementById('productId').value = p.id;
            document.getElementById('title').value = p.title;
            document.getElementById('category').value = p.category;
            document.getElementById('price').value = p.price;
            document.getElementById('buyNowUrl').value = p.buyNowUrl;
            document.getElementById('imageUrl').value = p.imageUrl || '';
            document.getElementById('description').value = p.description || '';
            document.getElementById('status').checked = p.status;
            document.getElementById('featured').checked = p.featured || false;
            document.getElementById('modalTitle').textContent = 'প্রোডাক্ট এডিট করুন';
            modal.classList.remove('hidden');
        };

        window.deleteProduct = async (id) => {
            if (confirm('আপনি কি নিশ্চিত যে এই প্রোডাক্টটি ডিলিট করতে চান?')) {
                await deleteProductFromDB(id);
            }
        };
    </script>
</body>
                            </html>
