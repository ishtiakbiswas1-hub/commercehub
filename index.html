<!DOCTYPE html>
<html lang="bn" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Affiliate E-Commerce Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .hero-gradient {
            background: radial-gradient(circle at top, rgba(79, 70, 229, 0.15) 0%, rgba(15, 23, 42, 1) 70%);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans hero-gradient selection:bg-indigo-500 selection:text-white">

    <!-- Top Header Advertisement Slot 1 -->
    <div id="adSlot1Container" class="bg-slate-900/80 border-b border-slate-800/80 py-2.5 text-center overflow-hidden hidden backdrop-blur-md"></div>

    <!-- Navigation Bar -->
    <header class="sticky top-0 z-40 bg-slate-950/80 backdrop-blur-xl border-b border-slate-800/80 shadow-2xl">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
            <a href="index.html" class="flex items-center gap-3 group">
                <div id="siteLogoBox" class="w-11 h-11 bg-gradient-to-tr from-indigo-600 to-violet-500 rounded-2xl flex items-center justify-center font-bold text-white shadow-xl shadow-indigo-500/20 group-hover:scale-105 transition-all overflow-hidden">
                    <i class="fa-solid fa-bag-shopping text-lg"></i>
                </div>
                <div>
                    <span id="siteNameDisplay" class="font-extrabold text-lg md:text-xl text-white tracking-wide block leading-none">Affiliate Shop</span>
                    <span class="text-[10px] text-indigo-400 font-semibold tracking-widest uppercase mt-0.5 block">Verified Deals</span>
                </div>
            </a>

            <!-- Search Bar -->
            <div class="hidden md:flex flex-1 max-w-lg mx-6">
                <div class="relative w-full group">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-indigo-400 transition-colors"></i>
                    <input type="text" id="searchInput" placeholder="আপনার পছন্দের প্রোডাক্ট খুঁজুন..." 
                        class="w-full bg-slate-900/90 border border-slate-800 rounded-2xl py-2.5 pl-11 pr-4 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all shadow-inner">
                </div>
            </div>

            <div class="flex items-center gap-3">
                <a href="#productsSection" class="hidden sm:inline-flex items-center gap-2 text-xs font-semibold px-4 py-2.5 bg-slate-900 hover:bg-slate-800 text-slate-300 rounded-xl border border-slate-800 transition-all">
                    <i class="fa-solid fa-fire text-amber-400"></i> ট্রেন্ডিং ডিলস
                </a>
                <a href="admin/login.html" class="p-2.5 bg-indigo-600/10 hover:bg-indigo-600/20 text-indigo-400 rounded-xl text-xs flex items-center gap-2 border border-indigo-500/30 transition-all font-semibold">
                    <i class="fa-solid fa-user-shield"></i>
                    <span class="hidden sm:inline">অ্যাডমিন</span>
                </a>
            </div>
        </div>
        <!-- Mobile Search Bar -->
        <div class="md:hidden px-4 pb-3.5">
            <div class="relative w-full">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                <input type="text" id="mobileSearchInput" placeholder="প্রোডাক্ট সার্চ করুন..." 
                    class="w-full bg-slate-900 border border-slate-800 rounded-xl py-2.5 pl-11 pr-4 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500">
            </div>
        </div>
    </header>

    <!-- Hero Banner / Ad Slot 2 -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full mt-6">
        <div id="adSlot2Container" class="glass-card rounded-3xl p-6 text-center hidden min-h-[120px] flex items-center justify-center shadow-2xl relative overflow-hidden"></div>
    </div>

    <!-- Category Filter Tabs -->
    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full mt-8">
        <div class="flex items-center gap-2.5 overflow-x-auto pb-2 scrollbar-none">
            <button onclick="filterCategory('All')" class="cat-btn px-5 py-2.5 bg-gradient-to-r from-indigo-600 to-violet-600 text-white font-bold text-xs rounded-2xl whitespace-nowrap shadow-lg shadow-indigo-600/30 hover:scale-105 transition-all">সকল ক্যাটাগরি</button>
            <button onclick="filterCategory('Electronics')" class="cat-btn px-5 py-2.5 glass-card text-slate-300 hover:text-white font-semibold text-xs rounded-2xl whitespace-nowrap transition-all hover:border-indigo-500/50">Electronics</button>
            <button onclick="filterCategory('Fashion')" class="cat-btn px-5 py-2.5 glass-card text-slate-300 hover:text-white font-semibold text-xs rounded-2xl whitespace-nowrap transition-all hover:border-indigo-500/50">Fashion</button>
            <button onclick="filterCategory('Gadgets')" class="cat-btn px-5 py-2.5 glass-card text-slate-300 hover:text-white font-semibold text-xs rounded-2xl whitespace-nowrap transition-all hover:border-indigo-500/50">Gadgets</button>
            <button onclick="filterCategory('Home & Lifestyle')" class="cat-btn px-5 py-2.5 glass-card text-slate-300 hover:text-white font-semibold text-xs rounded-2xl whitespace-nowrap transition-all hover:border-indigo-500/50">Home & Lifestyle</button>
        </div>
    </section>

    <!-- Main Products Section -->
    <main id="productsSection" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full my-10 flex-1">
        <div class="flex items-center justify-between mb-8">
            <div>
                <h2 class="text-xl md:text-2xl font-extrabold text-white flex items-center gap-2.5 tracking-tight">
                    <span class="w-2.5 h-8 bg-indigo-600 rounded-full inline-block shadow-lg shadow-indigo-500/50"></span>
                    সেরা এফিলিয়েট ডিল ও অফার
                </h2>
                <p class="text-xs text-slate-400 mt-1 ml-5">সরাসরি বিশ্বস্ত প্ল্যাটফর্ম থেকে সেরা মূল্যে কিনুন</p>
            </div>
            <span id="productCountBadge" class="text-xs font-semibold text-indigo-400 glass-card px-4 py-2 rounded-2xl border border-indigo-500/20 shadow-lg">লোড হচ্ছে...</span>
        </div>

        <!-- Products Grid with Modern Cards -->
        <div id="customerProductsGrid" class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5 md:gap-7">
            <!-- Dynamic Products -->
        </div>
    </main>

    <!-- Ad Slot 3 -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full my-8">
        <div id="adSlot3Container" class="glass-card rounded-3xl p-6 text-center hidden min-h-[100px] flex items-center justify-center shadow-xl"></div>
    </div>

    <!-- Footer -->
    <footer class="bg-slate-950 border-t border-slate-900 mt-16 pt-12 pb-8">
        <div id="adSlot4Container" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mb-8 text-center hidden"></div>
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row items-center justify-between gap-6 text-xs text-slate-400">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-indigo-600/20 rounded-xl flex items-center justify-center text-indigo-400 font-bold">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <p id="footerTextDisplay">© 2026 Affiliate Shop. All rights reserved.</p>
            </div>
            <div class="flex items-center gap-4">
                <a id="facebookLink" href="#" target="_blank" class="w-10 h-10 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-300 hover:text-white hover:bg-indigo-600 hover:border-indigo-600 transition-all hidden shadow-lg"><i class="fa-brands fa-facebook text-sm"></i></a>
                <a id="telegramLink" href="#" target="_blank" class="w-10 h-10 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-300 hover:text-white hover:bg-sky-500 hover:border-sky-500 transition-all hidden shadow-lg"><i class="fa-brands fa-telegram text-sm"></i></a>
            </div>
        </div>
    </footer>

    <!-- Script Logic -->
    <script type="module">
        import { db } from './assets/js/firebase.js';
        import { collection, doc, getDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        let allProductsCache = [];
        let currentCategory = 'All';
        let searchQuery = '';

        async function loadWebsiteSettings() {
            try {
                const docRef = doc(db, "settings", "general");
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data.siteName) {
                        document.getElementById('siteNameDisplay').textContent = data.siteName;
                        document.getElementById('pageTitle').textContent = data.siteName + ' - Best Affiliate Deals';
                    }
                    if (data.footerText) {
                        document.getElementById('footerTextDisplay').textContent = data.footerText;
                    }
                    if (data.logoUrl) {
                        document.getElementById('siteLogoBox').innerHTML = `<img src="${data.logoUrl}" class="w-full h-full object-cover">`;
                    }
                    if (data.facebookUrl) {
                        const fb = document.getElementById('facebookLink');
                        fb.href = data.facebookUrl;
                        fb.classList.remove('hidden');
                    }
                    if (data.telegramUrl) {
                        const tg = document.getElementById('telegramLink');
                        tg.href = data.telegramUrl;
                        tg.classList.remove('hidden');
                    }
                }
            } catch (err) {
                console.error("Error loading settings:", err);
            }
        }

        async function loadAdvertisements() {
            const slots = ['slot_1', 'slot_2', 'slot_3', 'slot_4'];
            for (let i = 0; i < slots.length; i++) {
                try {
                    const docRef = doc(db, "advertisements", slots[i]);
                    const docSnap = await getDoc(docRef);
                    if (docSnap.exists()) {
                        const ad = docSnap.data();
                        const container = document.getElementById(`adSlot${i + 1}Container`);
                        if (container && ad.status && ad.script) {
                            container.innerHTML = `<div class="w-full overflow-x-auto flex justify-center">${ad.script}</div>`;
                            container.classList.remove('hidden');
                        }
                    }
                } catch (err) {
                    console.error(`Error loading ad slot ${i+1}:`, err);
                }
            }
        }

        function loadCustomerProducts() {
            const q = query(collection(db, "products"), orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                allProductsCache = [];
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    if (data.status === true) {
                        allProductsCache.push({ id: docSnap.id, ...data });
                    }
                });
                renderProducts();
            });
        }

        function renderProducts() {
            const grid = document.getElementById('customerProductsGrid');
            const badge = document.getElementById('productCountBadge');
            grid.innerHTML = '';

            let filtered = allProductsCache.filter(p => {
                const matchCategory = currentCategory === 'All' || p.category === currentCategory;
                const matchSearch = p.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                    (p.description && p.description.toLowerCase().includes(searchQuery.toLowerCase()));
                return matchCategory && matchSearch;
            });

            badge.textContent = filtered.length + ' টি প্রোডাক্ট অ্যাভেইলেবল';

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-20 text-center glass-card rounded-3xl p-8">
                        <i class="fa-solid fa-box-open text-5xl text-indigo-500/50 mb-4 animate-float"></i>
                        <p class="text-sm font-semibold text-slate-400">এই মুহূর্তে এই ক্যাটাগরিতে কোনো প্রোডাক্ট নেই।</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(p => {
                const card = document.createElement('div');
                card.className = 'glass-card rounded-3xl overflow-hidden flex flex-col justify-between hover:border-indigo-500/50 transition-all duration-300 shadow-2xl group hover:-translate-y-1.5';
                card.innerHTML = `
                    <div>
                        <div class="relative aspect-square overflow-hidden bg-slate-900">
                            <img src="${p.imageUrl || 'https://via.placeholder.com/300'}" alt="${p.title}" class="w-full h-full object-cover group-hover:scale-110 transition-all duration-500">
                            ${p.featured ? '<span class="absolute top-3 left-3 px-3 py-1 bg-gradient-to-r from-indigo-600 to-violet-600 text-white text-[10px] font-extrabold rounded-full uppercase tracking-wider shadow-lg shadow-indigo-500/30">Featured</span>' : ''}
                        </div>
                        <div class="p-4">
                            <span class="text-[10px] font-bold text-indigo-400 uppercase tracking-widest block mb-1">${p.category}</span>
                            <h3 class="font-bold text-slate-100 text-xs md:text-sm line-clamp-2 group-hover:text-indigo-300 transition-colors">${p.title}</h3>
                            <p class="text-[11px] text-slate-400 mt-1.5 line-clamp-1">${p.description || ''}</p>
                        </div>
                    </div>
                    <div class="p-4 pt-0 flex items-center justify-between gap-2 border-t border-slate-800/60 mt-3 pt-3">
                        <div>
                            <span class="text-[10px] text-slate-500 block uppercase font-bold">মূল্য</span>
                            <span class="font-extrabold text-emerald-400 text-sm md:text-base">৳ ${p.price || 0}</span>
                        </div>
                        <a href="${p.buyNowUrl}" target="_blank" rel="nofollow noopener" 
                            class="px-4 py-2.5 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold text-xs rounded-2xl shadow-lg shadow-indigo-600/30 flex items-center gap-1.5 transition-all hover:scale-105 active:scale-95">
                            <span>Buy Now</span>
                            <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                        </a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        window.filterCategory = (cat) => {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.textContent.includes(cat) || (cat === 'All' && btn.textContent.includes('সকল'))) {
                    btn.className = 'cat-btn px-5 py-2.5 bg-gradient-to-r from-indigo-600 to-violet-600 text-white font-bold text-xs rounded-2xl whitespace-nowrap shadow-lg shadow-indigo-600/30 hover:scale-105 transition-all';
                } else {
                    btn.className = 'cat-btn px-5 py-2.5 glass-card text-slate-300 hover:text-white font-semibold text-xs rounded-2xl whitespace-nowrap transition-all hover:border-indigo-500/50';
                }
            });
            renderProducts();
        };

        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderProducts();
        });
        document.getElementById('mobileSearchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderProducts();
        });

        loadWebsiteSettings();
        loadAdvertisements();
        loadCustomerProducts();
    </script>
</body>
    </html>
